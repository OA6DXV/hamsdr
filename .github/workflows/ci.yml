name: C++ core

on:
  push:
    branches: [dev, main, unstable]
  pull_request:
    branches: [dev, main, unstable]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libopus0 pkg-config python3-venv
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DHAMSDR_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
