name: C++ core

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev pkg-config python3-venv
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install web test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt playwright==1.62.0
          .venv/bin/playwright install --with-deps chromium
      - name: Protocol, community persistence, and recovery
        run: |
          .venv/bin/python tests/integration_test.py -v
          .venv/bin/python tests/history_tests.py -v
          .venv/bin/python tests/waterfall_codec_tests.py -v
      - name: Desktop and mobile browser
        run: |
          .venv/bin/python server.py --demo --port 18094 &
          radio_pid=$!
          trap 'kill "$radio_pid"; wait "$radio_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18094/health; then break; fi
            sleep 1
          done
          .venv/bin/python tests/browser_test.py

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DHAMSDR_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
