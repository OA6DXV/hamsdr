# HTTP listener
[server]
bind = "127.0.0.1"
port = 18093
trusted_proxy = ""
max_clients = 10
max_clients_per_ip = 3

# Modes: false = direct HTTP with classic audio; true = native HTTPS/WSS using
# the certificate below; "proxy" = HTTP behind an HTTPS reverse proxy.
[secure]
enable = false
certificate = "tls/fullchain.pem"
private_key = "tls/privkey.pem"
origin = "https://radio.example.com:18093"

# Identity shown in the browser
[html]
receiver_name = "HamSDR"
description = [
  "Software-defined radio receiver"
]
callsign = "N0CALL"
show_admin = true

# Station metadata compatible with the legacy WebSDR directory format.
[station]
qth = "AA00aa"
description = "N0CALL | HamSDR | Example"
email = "radio@example.com"
logo = ""
mobile_page = "m.html"
bands = 1

[station.band.0]
name = "40m"
center_frequency_khz = 7100.500
sample_rate_khz = 1024.000
antenna = "Example antenna"

# Receiver connector. Only rtltcp is implemented currently.
[receiver]
type = "rtltcp"
host = "127.0.0.1"
port = 1234

[storage]
database = "var/community.sqlite3"
retention_days = 90

[logo]
file = ""
alt = "Receiver logo"
