# HTTP listener
[server]
bind = "127.0.0.1"
port = 18093
origin = ""
trusted_proxy = ""
max_clients = 10
max_clients_per_ip = 3

# Identity shown in the browser
[html]
receiver_name = "HamSDR"
description = [
  "Software-defined radio receiver"
]
callsign = "N0CALL"
show_admin = true

# Receiver connector. Only rtltcp is implemented currently.
[receiver]
type = "rtltcp"
host = "127.0.0.1"
port = 1234

[storage]
database = "var/community.sqlite3"
retention_days = 90

[logo]
file = ""
alt = "Receiver logo"
