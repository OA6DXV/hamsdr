# HTTP listener
[server]
bind = "127.0.0.1"
port = 18093
trusted_proxy = ""
max_clients = 10
max_clients_per_ip = 3

# Secure mode enables native HTTPS/WSS. In insecure mode, same-origin WebSockets
# and the classic low-latency audio fallback are used for direct HTTP access.
[secure]
enable = false
certificate = "tls/fullchain.pem"
private_key = "tls/privkey.pem"
origin = "https://radio.example.com:18093"

# Identity shown in the browser
[html]
receiver_name = "HamSDR"
description = [
  "Software-defined radio receiver"
]
callsign = "N0CALL"
show_admin = true

# Receiver connector. Only rtltcp is implemented currently.
[receiver]
type = "rtltcp"
host = "127.0.0.1"
port = 1234

[storage]
database = "var/community.sqlite3"
retention_days = 90

[logo]
file = ""
alt = "Receiver logo"
