# SPDX-License-Identifier: GPL-3.0-only
# Every installation-specific file must be placed directly in this directory.
working_directory = "/etc/hamsdr"

# HTTP listener
[server]
bind = "127.0.0.1"
port = 18093
trusted_proxy = ""
max_clients = 10
max_clients_per_ip = 3
full_quality_sessions_per_ip = 2
max_bandwidth_kbps_per_ip = 1000

# Modes: "insecure" = direct HTTP with classic audio; "native" = HTTPS/WSS
# using the certificate below; "proxy" = HTTP behind an HTTPS reverse proxy.
[secure]
mode = "insecure"
certificate = ""
private_key = ""
origin = ""

# Identity shown in the browser
[html]
receiver_name = "HamSDR"
description = [
  "Software-defined radio receiver"
]
callsign = "N0CALL"
show_admin = true

# Station metadata used by ReceiverBook and the browser identity.
[station]
qth = ""
description = ""
email = ""
mobile_page = "/"
flag = ""
flag_description = "Station flag"

# Bands must use contiguous indexes beginning at zero. The current receiver
# engine supports one enabled rtl_tcp band at 1024 kHz sample rate.
[band.0]
enable = false
name = ""
center_frequency_khz = 0.0
sample_rate_khz = 0.0
antenna = ""
receiver_type = "rtltcp"
receiver_host = "127.0.0.1"
receiver_port = 1234
receiver_gain = "auto"

# Paste the complete confirmation meta tag into tag before enabling discovery.
[receiverbook]
enable = false
tag = ""

[storage]
database = "community.sqlite3"
max_size_mb = 50
